# GitHub Actions counterpart of assets/gitlab-ci-release.yml, installed
# instead of it when the probed forge topology is GitHub rather than GitLab.
#
# `workflow_dispatch` is GitHub's manual-trigger primitive — the equivalent of
# the GitLab job's `when: manual`. There is no push-triggered or
# schedule-triggered release here for the same reason the GitLab job is
# branch-triggered rather than tag-triggered: a release tag this workflow
# itself pushes triggers no further run, so a tag-triggered job would silently
# never fire, and releasing must stay a deliberate click either way.
#
# Uses the GitHub CLI's `gh release create` rather than a bundled
# `github-release.sh` counterpart to gitlab-release.sh: `gh` ships preinstalled
# on GitHub-hosted runners and already reads notes from a file, so a
# hand-rolled REST call would duplicate what the CLI does natively — unlike
# GitLab, where release-cli is not present in the job image scripts/release.sh
# runs under.
name: release

on:
  workflow_dispatch:
    inputs:
      preview:
        description: "Preview only — creates nothing"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      - name: Install git-cliff
        run: pip install --quiet --disable-pip-version-check 'git-cliff==2.10.1'

      - name: Configure git identity
        run: |
          git config user.email "actions@github.com"
          git config user.name "GitHub Actions"

      - name: Preview
        if: ${{ github.event.inputs.preview == 'true' }}
        run: PREVIEW=1 bash scripts/release.sh

      - name: Release
        if: ${{ github.event.inputs.preview != 'true' }}
        env:
          CONFIRM_VERSION: ${{ vars.CONFIRM_VERSION }}
          GH_TOKEN: ${{ github.token }}
        run: |
          bash scripts/release.sh
          TAG=$(git describe --tags --abbrev=0 --match='v[0-9]*.[0-9]*.[0-9]*')
          gh release create "$TAG" --notes-file /tmp/release-notes.md
