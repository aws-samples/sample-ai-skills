name: Enhancement
description: Ask for a capability the project does not have yet.
body:
  - type: markdown
    attributes:
      value: |
        Title: name the capability you want, in 50 to 80 characters, using the key words someone searching for this request would type. Ask for one change per issue, and check the existing issues first.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What you are trying to do, and what stops you today. Describe the need, not a solution.
    validations:
      required: true
  - type: textarea
    id: proposed-behavior
    attributes:
      label: Proposed behavior
      description: What the project should do once this is done, described from the point of view of someone using it.
    validations:
      required: true
  - type: textarea
    id: alternatives-considered
    attributes:
      label: Alternatives considered
      description: Other ways to meet the need, including any workaround you use now, and why each falls short.
  - type: textarea
    id: additional-context
    attributes:
      label: Additional context
      description: Anything else needed to judge the request, such as who else needs it or a link to a related issue.
